name: Build Windows 9.4.1
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-941
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64
      - name: Download and verify source and original runtime
        run: |
          gh release download v9.4.1 --repo "$env:GITHUB_REPOSITORY" --pattern MajesticOrganizer-9.4.1-source-r2.zip
          if ($LASTEXITCODE) { throw "Source download failed" }
          if ((Get-FileHash MajesticOrganizer-9.4.1-source-r2.zip -Algorithm SHA256).Hash.ToLower() -ne "b5736d930f3003a886ea6f4ff3b6631c518a474268226c43134dd7b8489a90ff") { throw "Source checksum mismatch" }
          Expand-Archive MajesticOrganizer-9.4.1-source-r2.zip -DestinationPath payload
          gh release download v9.4.0 --repo "$env:GITHUB_REPOSITORY" --pattern MajesticOrganizer-Setup-9.4.0-x64.exe
          if ($LASTEXITCODE) { throw "Runtime download failed" }
          if ((Get-FileHash MajesticOrganizer-Setup-9.4.0-x64.exe -Algorithm SHA256).Hash.ToLower() -ne "a2f263289ea07dc216549b9ab8b3fc1c50a88d4bf4c27aeaa86faa504b28a733") { throw "Runtime checksum mismatch" }
          $base = Join-Path $env:RUNNER_TEMP "MajesticReference"
          $process = Start-Process ./MajesticOrganizer-Setup-9.4.0-x64.exe -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/DIR=$base") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Reference installation failed" }
          $runtime = Join-Path $base "_internal/tesseract"
          if (!(Test-Path "$runtime/tesseract.exe")) { throw "Original OCR runtime not found" }
          "TESSERACT_DIR=$runtime" >> $env:GITHUB_ENV
      - name: Install build dependencies
        working-directory: payload/MajesticOrganizer
        run: |
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE) { throw "pip failed" }
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE) { throw "Inno Setup installation failed" }
      - name: Test and build installer
        working-directory: payload/MajesticOrganizer
        run: |
          python tools/build_windows.py
          if ($LASTEXITCODE) { throw "Build failed" }
      - name: Smoke test packaged application
        run: |
          $exe = Resolve-Path payload/MajesticOrganizer/dist/MajesticOrganizer/MajesticOrganizer.exe
          $app = Start-Process $exe -PassThru
          Start-Sleep -Seconds 8
          if ($app.HasExited) { throw "Application exited during startup" }
          Stop-Process -Id $app.Id
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-941-diagnostics
          path: |
            payload/MajesticOrganizer/build/*.txt
            payload/MajesticOrganizer/build/*.json
            payload/MajesticOrganizer/release/*
